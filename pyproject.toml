[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bijax"
dynamic  = ["version"]
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.22.9",
    "equinox>=0.12.1",
    "jax>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "optax>=0.2.4",
    "pdoc>=16.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bijax.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=bijax --cov-report=term-missing"

[tool.pyright]
reportMissingSuperCall = false
extraPaths = ["src"]

[tool.ruff]
extend-exclude = [".#*", "~*"]

[tool.ruff.lint]
select = ["D", "C", "B", "I", "UP", "SIM"]
ignore = ["F722", "E741", "E743", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"noxfile.py" = ["D"]